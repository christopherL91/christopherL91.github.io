<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{- partial "head.html" . }}
</head>
<body id="top" class="relative flex min-h-screen flex-col overflow-x-hidden bg-canvas font-sans text-ink antialiased">
  <div aria-hidden="true" class="board-bg pointer-events-none absolute inset-x-0 top-0 -z-10 h-[56rem]"></div>
  <a href="#main" class="sr-only z-50 rounded-md bg-ink px-3 py-2 font-mono text-sm text-canvas focus:not-sr-only focus:absolute focus:top-3 focus:left-3">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" class="flex-1">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <a href="#top" class="to-top no-print" aria-label="Back to top"><span aria-hidden="true">↑</span></a>
</body>
</html>
